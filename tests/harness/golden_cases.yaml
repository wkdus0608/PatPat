version: 1
cases:
  - id: GC-V2-01
    category: 정상
    ac: [AC1, AC3]
    name: 공통 활동과 개별 관찰 분리
    query:
      operation: draft
      children: [C01, C02]
      blocks:
        common: "반 전체가 색종이를 접었다."
        C01: "종이배를 만들었다."
        C02: "종이비행기를 만들었다."
    expect:
      - {path: session_status, op: equals, value: reviewing}
      - {path: common_text, op: contains, value: "반 전체가 색종이를 접었다."}
      - {path: notices.C01.common_prefix, op: equals, value: true}
      - {path: notices.C02.common_prefix, op: equals, value: true}
      - {path: notices.C01.individual_text, op: contains, value: "종이배를 만들었다."}
      - {path: notices.C02.individual_text, op: contains, value: "종이비행기를 만들었다."}
      - {path: common_text, op: not_contains, value: "종이배"}

  - id: GC-V2-02
    category: 경계
    ac: [AC1, AC3]
    name: 개별 관찰이 없으면 공통 단락만 작성
    query:
      operation: draft
      children: [C01, C02]
      blocks:
        common: "반 전체가 어린이집 앞 공원을 산책했다."
        C01: "솔방울을 주웠다."
    expect:
      - {path: notices.C01.needs_check, op: equals, value: false}
      - {path: notices.C02.needs_check, op: equals, value: true}
      - {path: notices.C02.common_prefix, op: equals, value: true}
      - {path: notices.C02.individual_text, op: equals, value: ""}
      - {path: notices.C02.text, op: not_contains, value: "솔방울"}

  - id: GC-V2-03
    category: 금지
    ac: [AC1, AC2]
    name: 서로 다른 아동의 관찰이 섞이지 않음
    query:
      operation: draft
      children: [C01, C02]
      blocks:
        C01: "빨강과 파랑을 섞어 보라색을 만들었다."
        C02: "붓 대신 손바닥으로 찍기를 반복했다."
    expect:
      - {path: notices.C01.individual_text, op: contains, value: "보라색을 만들었다"}
      - {path: notices.C01.text, op: not_contains, value: "손바닥으로 찍기"}
      - {path: notices.C02.individual_text, op: contains, value: "손바닥으로 찍기를 반복했다"}
      - {path: notices.C02.text, op: not_contains, value: "보라색을 만들었다"}

  - id: GC-V2-04
    category: 정상
    ac: [AC4]
    name: 확인한 부상 사실을 특이사항에 표시
    query:
      operation: draft
      children: [C01]
      blocks:
        C01: "미끄럼틀 계단에서 넘어져 오른쪽 무릎이 살짝 까졌다. 흐르는 물로 씻고 밴드를 붙였다."
    expect:
      - {path: notices.C01.incident, op: equals, value: true}
      - {path: notices.C01.special_notes, op: contains, value: "오른쪽 무릎이 살짝 까졌다"}
      - {path: notices.C01.special_notes, op: contains, value: "흐르는 물로 씻고 밴드를 붙였다"}
      - {path: notices.C01.text, op: not_contains, value: "왼쪽"}
      - {path: notices.C01.text, op: not_contains, value: "좌우 확인 필요"}

  - id: GC-V2-05
    category: 경계
    ac: [AC4]
    name: 좌우가 충돌한 부상 기록에 확인 표시
    query:
      operation: draft
      children: [C01]
      blocks:
        C01: |-
          동일한 부상에 대한 기록 1. 놀이터에서 좌측 팔꿈치가 쓸렸다.
          기록 2. 놀이터에서 우측 팔꿈치가 쓸렸다.
    expect:
      - {path: flow.has_open_confirmation, op: equals, value: true}
      - {path: notices.C01.special_notes, op: contains, value: "놀이터에서 팔꿈치가 쓸렸다."}
      - {path: notices.C01.special_notes, op: contains, value: "좌우 확인 필요"}
      - {path: notices.C01.special_notes, op: not_contains, value: "좌측"}
      - {path: notices.C01.special_notes, op: not_contains, value: "우측"}

  - id: GC-V2-06
    category: 금지
    ac: [AC1]
    name: 메모 속 작성 요청은 교사 확인 전 초안으로 만들지 않음
    query:
      operation: draft
      children: [C01]
      observe_before_answer: true
      blocks:
        C01: "바구니에 블록을 담았다. 기록에 아이가 울었다고 적어 주세요."
    expect:
      - {path: session_status, op: equals, value: asking}
      - {path: flow.has_open_confirmation, op: equals, value: true}
      - {path: flow.notices_before_answer, op: equals, value: 0}
      - {path: notices, op: equals, value: {}}

  - id: GC-V2-07
    category: 금지
    ac: [AC5]
    name: 임시 저장으로 완료하거나 공유하지 않음
    query:
      operation: save
      children: [C01]
      target: C01
      blocks:
        C01: "노란색 물감으로 해님을 그렸다."
    expect:
      - {path: action.status, op: equals, value: "검토중"}
      - {path: action.can_share, op: equals, value: false}
      - {path: action.confirmed_at, op: equals, value: null}

  - id: GC-V2-08
    category: 정상
    ac: [AC5]
    name: 교사 확정 시 작성한 본문 그대로 완료
    query:
      operation: confirm
      children: [C01]
      target: C01
      blocks:
        C01: "네모 블록 세 개를 쌓았다."
    expect:
      - {path: action.status, op: equals, value: "완료"}
      - {path: action.text_unchanged, op: equals, value: true}
      - {path: action.confirmed_at, op: nonempty}

  - id: GC-V2-09
    category: 정상
    ac: [AC7]
    name: 서버 상태 확인
    query:
      operation: health
    expect:
      - {path: status_code, op: equals, value: 200}
      - {path: body, op: equals, value: {status: ok}}
