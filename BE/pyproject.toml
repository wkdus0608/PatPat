[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patpat-be"
version = "0.1.0"
description = "PatPat MVP backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = [
    "httpx2>=2.0,<3.0",
    "pytest>=8,<10",
]
