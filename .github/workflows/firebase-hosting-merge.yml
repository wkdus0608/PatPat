# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd FE && npx --yes pnpm@11.25.0 install --frozen-lockfile &&
          EXPO_PUBLIC_API_BASE_URL=https://patpat-demo-1110.eastasia.cloudapp.azure.com
          npx --yes pnpm@11.25.0 export:web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: FE
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PATPAT_DEMO }}
          channelId: live
          projectId: patpat-demo
