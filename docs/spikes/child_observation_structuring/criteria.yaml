# SP-01 성공 조건을 실행 코드가 읽도록 옮긴 사본이다. 정본은 ../child_observation_structuring.md 3절이다.
# 값은 문서 3절의 초안 값을 그대로 옮겼다. 팀이 실행 전에 확인하고 아래 확정 칸을 채운다.
# 확정 칸이 비어 있으면 spike.py는 라벨 대조와 평가 실행을 하지 않는다.
# 결과를 본 뒤에는 이 파일과 문서 3절을 바꾸지 않는다(SP-01 문서 3절 마지막 문단, 강의 04 작성지침 D절 "3. 성공 조건").
spike: SP-01
eval_count: 30           # 평가 메모 수
pass_min: 27             # 일치 27건 이상(90%)이면 통과
critical_errors_max: 0   # 아동 혼동·없는 사실 추가는 0건
time_limit_hours: 6      # 준비·라벨 작성·실행·대조·기록 합계
budget_krw: 10000        # 외부 API 비용 상한
runs_per_memo: 1

# 판정 단위. 문서 3절은 같은 아동의 사실을 정답과 다른 개수의 관찰로 나눈 경우를 정하지 않았다.
# 팀이 둘 중 하나를 고른다.
#   child_set: 같은 아동 집합에 연결된 관찰을 묶어 비교한다. 같은 아동 집합의 사실을 관찰 하나로 쓰든 여럿으로 나누든 같게 본다.
#   strict:    관찰 개수와 나눈 경계까지 정답과 같아야 한다.
# 두 방식 모두 아동 집합이 정답과 다르면 자동으로 실패다(문서 3절 "필드·ID·아동 집합은 자동으로 대조한다").
judgement_unit: null

confirmed_by: []         # 기준을 확인한 팀원(예: GitHub 아이디)
confirmed_at: null       # 확정한 날짜, YYYY-MM-DD
