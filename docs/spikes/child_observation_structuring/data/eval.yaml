memos:
  - memo_id: E01
    group: 한 아동
    child_ids: [C01]
    text: "책 읽기. C01 공룡 그림책 혼자 끝까지 넘겨 보고 '티라노가 제일 세' 함."
  - memo_id: E02
    group: 여러 아동
    child_ids: [C01, C02, C03]
    text: "역할놀이. C01 엄마 역할로 인형 업어 줌. C02는 가게 주인 하면서 '천 원이에요' 함. C03은 계속 손님만 함."
  - memo_id: E03
    group: 공통·공동
    child_ids: [C01, C02, C03]
    text: "생일잔치. 다 같이 C02 생일 축하 노래 부름. C02 촛불 끄고 '고맙습니다' 함."
  - memo_id: E04
    group: 한 아동
    child_ids: [C02]
    text: "점심. C02 시금치나물은 남기고 밥이랑 국은 다 먹음."
  - memo_id: E05
    group: 여러 아동
    child_ids: [C04, C05]
    text: "물놀이. C04 물총으로 벽에 물 뿌리며 그림 그림. C05는 물 튀는 게 싫다고 해서 바가지로 물만 옮김."
  - memo_id: E06
    group: 공통·공동
    child_ids: [C04, C05, C06]
    text: "소방 대피 훈련. 반 전체 손수건으로 입 막고 줄 서서 밖으로 나감. C05는 사이렌 소리에 놀라서 교사 손 잡고 나감."
  - memo_id: E07
    group: 한 아동
    child_ids: [C03, C04]
    text: "미술. C03 색종이 반으로 접어서 하트 모양 오림."
  - memo_id: E08
    group: 여러 아동
    child_ids: [C06, C07, C08]
    text: "밀가루 반죽 놀이. C06 반죽으로 동그라미 여러 개 만들어서 '쿠키'라고 함. C07은 반죽 손으로 안 만지고 도구로만 찍음. C08은 C06 쿠키 보고 똑같이 따라 만듦."
  - memo_id: E09
    group: 공통·공동
    child_ids: [C07, C08]
    text: "요리활동. C07이랑 C08 같이 주먹밥 만들고 서로 하나씩 바꿔 먹음."
  - memo_id: E10
    group: 한 아동
    child_ids: [C05]
    text: "신체활동. C05 평균대 끝까지 혼자 건넘. 중간에 한 번 멈췄다가 다시 감."
  - memo_id: E11
    group: 여러 아동
    child_ids: [C09, C10, C11]
    text: "바깥놀이. C09 그네 혼자 탐. C10, C11은 철봉에 매달려서 누가 오래 버티나 함."
  - memo_id: E12
    group: 공통·공동
    child_ids: [C09, C10, C11, C12]
    text: "견학. 다 같이 소방서 견학 감. C09, C10은 소방차 운전석에 앉아 봄. C12는 '물 어디서 나와요?' 하고 질문함."
  - memo_id: E13
    group: 한 아동
    child_ids: [C06]
    text: "등원. C06 엄마랑 헤어질 때 울다가 교실 들어와서 금방 그침."
  - memo_id: E14
    group: 여러 아동
    child_ids: [C12, C01]
    text: "미술. C12 크레파스로 무지개 그리고 빨간색만 두 번 덧칠함. C01은 스티커 붙이기만 함."
  - memo_id: E15
    group: 공통·공동
    child_ids: [C01, C03]
    text: "마트놀이. C01, C03 같이 하다가 계산대를 서로 하겠다고 말다툼함. 가위바위보로 정해서 C03이 먼저 함."
  - memo_id: E16
    group: 한 아동
    child_ids: [C07]
    text: "요리활동. C07 바나나 껍질 직접 벗기고 플라스틱 칼로 자름. '내가 잘랐어요' 함."
  - memo_id: E17
    group: 여러 아동
    child_ids: [C02, C03, C04]
    text: "음악. C02 실로폰 치면서 '도레미' 노래함. C03은 북 세게 치다가 교사가 살살 치자고 하니 살살 침. C04는 마라카스 흔들다가 내려놓고 구경함."
  - memo_id: E18
    group: 공통·공동
    child_ids: [C04, C05, C06]
    text: "비눗방울 놀이. 다 같이 마당에서 비눗방울 불기 함. C06은 비눗방울 터뜨리려고 계속 뛰어다님. C04가 '나도 불래' 해서 C05가 막대를 빌려줌."
  - memo_id: E19
    group: 한 아동
    child_ids: [C08, C09]
    text: "손씻기. C08 비누칠하고 노래 끝날 때까지 손 비빔."
  - memo_id: E20
    group: 여러 아동
    child_ids: [C05, C06]
    text: "점심. C05 숟가락 혼자 쓰고 김치를 한 번 먹어 봄. C06은 밥 반 정도 먹고 '배불러요' 함."
  - memo_id: E21
    group: 공통·공동
    child_ids: [C07, C08, C09]
    text: "간식. 다 같이 떡이랑 우유 먹음. C08은 떡은 안 먹고 우유만 마심."
  - memo_id: E22
    group: 한 아동
    child_ids: [C10]
    text: "자유놀이. C10 레고로 로봇 만들다가 팔이 두 번 빠지자 다시 끼워서 완성함."
  - memo_id: E23
    group: 여러 아동
    child_ids: [C07, C08, C09]
    text: "책 읽기. C07 교사가 읽어 준 책을 다시 가져와서 또 읽어 달라고 함. C08은 책장 넘기는 걸 도와줌. C09는 다른 자리에서 퍼즐 맞춤."
  - memo_id: E24
    group: 공통·공동
    child_ids: [C10, C11]
    text: "협동 미술. C10, C11 둘이 큰 종이에 같이 바다 그림 그림. C10은 물고기, C11은 배를 그림."
  - memo_id: E25
    group: 한 아동
    child_ids: [C11]
    text: "간식. C11 우유 컵 두 손으로 들고 다 마심. 귤은 안 먹겠다고 함."
  - memo_id: E26
    group: 여러 아동
    child_ids: [C10, C11, C12]
    text: "정리 시간. C10 장난감을 바구니에 제자리대로 넣음. C11은 의자 정리함. C12는 정리 안 하고 계속 놀겠다고 함."
  - memo_id: E27
    group: 공통·공동
    child_ids: [C01, C02, C12]
    text: "도서관 나들이. 다 같이 동네 도서관 가서 책 한 권씩 빌림. C01은 '기차 책 빌릴래' 하고 기차 책 고름."
  - memo_id: E28
    group: 한 아동
    child_ids: [C12]
    text: "과학놀이. C12 돋보기로 돌멩이 보더니 '반짝이가 있어요' 함."
  - memo_id: E29
    group: 여러 아동
    child_ids: [C01, C04, C07]
    text: "신체놀이. C01 훌라후프 다섯 번 돌림. C04는 훌라후프 굴려서 C07한테 보냄. C07은 받아서 다시 굴려 줌."
  - memo_id: E30
    group: 공통·공동
    child_ids: [C03, C04, C05, C06]
    text: "체육. 다 같이 공 굴리기 함. C03, C04 한 팀으로 공 굴려서 골대에 넣음. C05는 넘어졌는데 다치지 않고 바로 일어남. C06은 결석."
