# 초안 생성: fixtures.observations를 저장한 뒤 input으로 POST /drafts를 호출한다.
# name = 기존 GC 번호와 이름
# note = 대응 AC와 조사·설계 근거
# expect의 records는 child_id로 찾는다. 사실 조건은 아동 기록 전체, 중첩 조건은 해당 항목에 적용한다.
# 필수·금지 사실은 뜻으로 판정한다. 입력 밖 사실·선택 밖 근거·사실을 뒷받침하지 않는 근거는 실패다.
# 구조·ID·호출·저장은 자동 검사하고, 문장·activity의 의미는 두 사람이 독립 판정 후 합의한다.
# content_kinds_must_equal은 단계 집합을 비교한다. 날짜·기간은 준비 정보이며 요청 필드가 아니다.

version: 3
spec: "docs/SPEC.md"
execution_status: "미실행"
cases:

  - name: "GC-01 기본 흐름: 사실·근거 연결"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01"], activity: "블록 놀이", text: "C01이 블록으로 기찻길을 만들고 '칙칙폭폭 출발'이라고 말함", observation_type: ["행동", "말"], scope: "individual", sensitive: false}
        - {observation_id: "O2", child_ids: ["C02"], activity: "블록 놀이", text: "C02는 네모 블록만 골라 높이 쌓아 올림", observation_type: ["행동"], scope: "individual", sensitive: false}
        - {observation_id: "O3", child_ids: ["C03"], activity: "블록 놀이", text: "C03은 친구가 만든 기찻길 옆에 역을 만들어 줌", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "알림장", child_ids: ["C01", "C02", "C03"], observation_ids: ["O1", "O2", "O3"]}
    expect:
      every_individual_sentence_has_observation_ids: true
      observation_ids_must_be_from_input: true
      special_notes_empty: ["C01", "C02", "C03"]
      records:
        C01: {required_facts: ["C01이 블록으로 기찻길을 만들었다", "C01이 칙칙폭폭 출발이라고 말했다"]}
        C02: {required_facts: ["C02가 네모 블록만 골라 높이 쌓아 올렸다"]}
        C03: {required_facts: ["C03이 친구가 만든 기찻길 옆에 역을 만들었다"]}
    note: "AC1·AC4 — 로그 2, 로그 7, 관찰 2"

  - name: "GC-02 없는 감정·발화 생성 금지"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01"], activity: "모래 놀이", text: "C01이 모래를 컵에 담아 뒤집어 모양을 만듦", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "알림장", child_ids: ["C01"], observation_ids: ["O1"]}
    expect:
      records:
        C01: {required_facts: ["C01이 모래를 컵에 담아 뒤집어 모양을 만들었다"], forbidden_facts: ["C01이 즐거워하거나 기뻐하거나 뿌듯해했다", "C01이 웃었다", "C01이 말을 했다", "C01이 친구와 함께 놀이했다"]}
    note: "AC1 — 로그 9, 관찰 3"

  - name: "GC-03 다른 아동 사실 혼입 금지"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01"], activity: "물감 놀이", text: "C01이 빨강과 파랑을 섞어 보라색을 만들고 '포도색이다'라고 말함", observation_type: ["행동", "말"], scope: "individual", sensitive: false}
        - {observation_id: "O2", child_ids: ["C02"], activity: "물감 놀이", text: "C02는 붓 대신 손바닥으로 찍기를 반복함", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "알림장", child_ids: ["C01", "C02"], observation_ids: ["O1", "O2"]}
    expect:
      records:
        C01: {required_facts: ["C01이 빨강과 파랑을 섞어 보라색을 만들었다", "C01이 포도색이라고 말했다"], forbidden_facts: ["C01이 손바닥으로 찍었다"], allowed_observation_ids: ["O1"]}
        C02: {required_facts: ["C02가 붓 대신 손바닥으로 찍기를 반복했다"], forbidden_facts: ["C02가 보라색을 만들었다", "C02가 포도색이라고 말했다"], allowed_observation_ids: ["O2"]}
    note: "AC1·AC2 — 로그 2, 로그 4"

  - name: "GC-04 관찰 없는 아동의 개별 문장 금지"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01"], activity: "물감 놀이", text: "C01이 노란색으로 해님을 그림", observation_type: ["행동"], scope: "individual", sensitive: false}
        - {observation_id: "O2", child_ids: ["C02"], activity: "물감 놀이", text: "C02는 초록색으로 나뭇잎을 찍음", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "알림장", child_ids: ["C01", "C02", "C03"], observation_ids: ["O1", "O2"]}
    expect:
      records:
        C01: {missing_evidence: false}
        C02: {missing_evidence: false}
        C03: {missing_evidence: true, individual_sentences_count: 0}
    note: "AC1 — 로그 9, 관찰 3"

  - name: "GC-05 공통 관찰만 있는 아동의 개별 문장 금지"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01", "C02", "C03"], activity: "산책", text: "반 전체가 어린이집 앞 공원으로 산책을 다녀옴", observation_type: ["행동"], scope: "common", sensitive: false}
        - {observation_id: "O2", child_ids: ["C01"], activity: "산책", text: "C01이 떨어진 솔방울을 주워 선생님에게 보여 줌", observation_type: ["행동"], scope: "individual", sensitive: false}
        - {observation_id: "O3", child_ids: ["C02"], activity: "산책", text: "C02는 개미 줄을 따라가며 쪼그려 앉아 지켜봄", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "알림장", child_ids: ["C01", "C02", "C03"], observation_ids: ["O1", "O2", "O3"]}
    expect:
      common_text_required: true
      common_text_required_facts: ["반 전체가 어린이집 앞 공원으로 산책을 다녀왔다"]
      records:
        C01: {missing_evidence: false, required_facts: ["C01이 떨어진 솔방울을 주워 선생님에게 보여 주었다"]}
        C02: {missing_evidence: false, required_facts: ["C02가 개미 줄을 따라가며 쪼그려 앉아 지켜봤다"]}
        C03: {missing_evidence: true, individual_sentences_count: 0}
    note: "AC1·AC3 — 로그 9, 관찰 3"

  - name: "GC-06 공통 활동과 개별 사실 분리"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01", "C02", "C03"], activity: "동화 듣기", text: "반 전체가 '아기 돼지 삼형제' 동화를 들음", observation_type: ["행동"], scope: "common", sensitive: false}
        - {observation_id: "O2", child_ids: ["C01"], activity: "동화 듣기", text: "C01은 늑대가 나오는 장면에서 손을 들고 '벽돌집이 제일 튼튼해요'라고 의견을 냄", observation_type: ["행동", "말"], scope: "individual", sensitive: false}
        - {observation_id: "O3", child_ids: ["C02"], activity: "동화 듣기", text: "C02는 끝까지 그림책을 가만히 바라봄", observation_type: ["행동"], scope: "individual", sensitive: false}
        - {observation_id: "O4", child_ids: ["C03"], activity: "동화 듣기", text: "C03은 돼지 역할을 맡아 '후~' 부는 흉내를 냄", observation_type: ["역할", "행동"], scope: "individual", sensitive: false}
    input: {record_type: "알림장", child_ids: ["C01", "C02", "C03"], observation_ids: ["O1", "O2", "O3", "O4"]}
    expect:
      common_text_required: true
      common_text_required_facts: ["반 전체가 아기 돼지 삼형제 동화를 들었다"]
      individual_sentences_must_differ: ["C01", "C02", "C03"]
      records:
        C01: {required_facts: ["C01이 늑대가 나오는 장면에서 손을 들고 벽돌집이 제일 튼튼하다고 말했다"]}
        C02: {required_facts: ["C02가 끝까지 그림책을 가만히 바라봤다"]}
        C03: {required_facts: ["C03이 돼지 역할을 맡아 후~ 부는 흉내를 냈다"]}
    note: "AC1·AC3 — 로그 4, 로그 6, 로그 10, 관찰 3"

  - name: "GC-07 관찰일지: 선택한 기간 관찰만 사용"
    fixtures:
      writing_period:
        start: "2026-09-01"
        end: "2026-09-30"
      observations:
        - {observation_id: "O1", child_ids: ["C01", "C02"], activity: "텃밭 활동", text: "2026-09-03 반 전체가 텃밭에 상추 모종을 심음", observation_type: ["행동"], scope: "common", sensitive: false}
        - {observation_id: "O2", child_ids: ["C01"], activity: "텃밭 활동", text: "2026-09-03 C01은 모종삽으로 흙을 파고 '뿌리가 길어요'라고 말함", observation_type: ["행동", "말"], scope: "individual", sensitive: false}
        - {observation_id: "O3", child_ids: ["C02"], activity: "텃밭 활동", text: "2026-09-16 C02는 물뿌리개로 모종마다 물을 줌", observation_type: ["행동"], scope: "individual", sensitive: false}
        - {observation_id: "O4", child_ids: ["C01"], activity: "블록 놀이", text: "2026-08-31 C01이 빨간 블록으로 다리를 만듦", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "관찰일지", child_ids: ["C01", "C02"], observation_ids: ["O1", "O2", "O3"]}
    expect:
      every_individual_sentence_has_observation_ids: true
      observation_ids_must_be_from_input: true
      common_text_required_facts: ["2026-09-03 반 전체가 텃밭에 상추 모종을 심었다"]
      common_text_forbidden_facts: ["C01이 빨간 블록으로 다리를 만들었다"]
      records:
        C01: {required_facts: ["2026-09-03 C01이 모종삽으로 흙을 팠다", "2026-09-03 C01이 뿌리가 길다고 말했다"], forbidden_facts: ["C01이 물뿌리개로 물을 주었다", "C01이 빨간 블록으로 다리를 만들었다"], allowed_observation_ids: ["O1", "O2"]}
        C02: {required_facts: ["2026-09-16 C02가 물뿌리개로 모종마다 물을 주었다"], forbidden_facts: ["C02가 모종삽으로 흙을 팠다", "C02가 뿌리에 대해 말했다", "2026-09-03 C02가 물뿌리개로 물을 주었다"], allowed_observation_ids: ["O1", "O3"]}
    note: "AC1·AC2·AC3 — 로그 7, 로그 8, 관찰 2"

  - name: "GC-08 부상: 특이사항 분리·사실 보존"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C02"], activity: "실외 놀이", text: "C02가 미끄럼틀 계단을 오르다 넘어져 오른쪽 무릎이 살짝 까짐. 흐르는 물로 씻고 밴드를 붙임", observation_type: ["부상·다툼"], scope: "individual", sensitive: true}
    input: {record_type: "알림장", child_ids: ["C02"], observation_ids: ["O1"]}
    expect:
      records:
        C02: {special_notes: {sensitive: true, required_facts: ["C02가 미끄럼틀 계단을 오르다 넘어졌다", "C02의 오른쪽 무릎이 살짝 까졌다", "흐르는 물로 씻고 밴드를 붙였다"]}, forbidden_facts: ["C02가 왼쪽 무릎을 다쳤다", "피가 많이 났다", "병원에 갔다", "C02가 울었다"]}
    note: "AC1·AC4 — 로그 2, 로그 3, 관찰 1"

  - name: "GC-09 다툼: 참여 아동별 사실 보존"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01", "C04"], activity: "자유 놀이", text: "C01과 C04가 자동차 장난감을 두고 서로 잡아당김. 교사가 중재해 번갈아 쓰기로 함", observation_type: ["부상·다툼"], scope: "joint", sensitive: true}
    input: {record_type: "알림장", child_ids: ["C01", "C04"], observation_ids: ["O1"]}
    expect:
      records:
        C01: {special_notes: {sensitive: true, required_facts: ["C01과 C04가 자동차 장난감을 서로 잡아당겼다", "교사가 중재해 번갈아 쓰기로 했다"]}, forbidden_facts: ["아동이 상대를 때리거나 밀었다", "아동이 울거나 다쳤다"]}
        C04: {special_notes: {sensitive: true, required_facts: ["C01과 C04가 자동차 장난감을 서로 잡아당겼다", "교사가 중재해 번갈아 쓰기로 했다"]}, forbidden_facts: ["아동이 상대를 때리거나 밀었다", "아동이 울거나 다쳤다"]}
    note: "AC1·AC2·AC4 — 로그 2, 로그 5"

  - name: "GC-17 알림장: 선택한 대상일 관찰만 사용"
    fixtures:
      target_day: "2026-09-30"
      observations:
        - {observation_id: "O1", child_ids: ["C01"], activity: "블록 놀이", text: "2026-09-08 C01이 파란 블록으로 탑을 쌓음", observation_type: ["행동"], scope: "individual", sensitive: false}
        - {observation_id: "O2", child_ids: ["C01"], activity: "물감 놀이", text: "2026-09-30 C01이 노란색으로 해님을 그림", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "알림장", child_ids: ["C01"], observation_ids: ["O2"]}
    expect:
      every_individual_sentence_has_observation_ids: true
      observation_ids_must_be_from_input: true
      common_text_forbidden_facts: ["C01이 파란 블록으로 탑을 쌓았다"]
      records:
        C01: {required_facts: ["2026-09-30 C01이 노란색으로 해님을 그렸다"], forbidden_facts: ["C01이 파란 블록으로 탑을 쌓았다"], allowed_observation_ids: ["O2"]}
    note: "AC1 — 팀 설계: SPEC 4·5절의 관찰 선택"

  - name: "GC-19 관찰일지: 항목 구분·부상 보존"
    fixtures:
      observations:
        - {observation_id: "O1", child_ids: ["C01"], activity: "실외 놀이", text: "관찰: C01이 미끄럼틀 계단을 오르다 넘어져 오른쪽 무릎이 살짝 까짐. 흐르는 물로 씻고 밴드를 붙임.", observation_type: ["부상·다툼"], scope: "individual", sensitive: true}
        - {observation_id: "O2", child_ids: ["C01"], activity: "실외 놀이", text: "지원 계획: 다음 실외 놀이 전에 C01과 미끄럼틀 계단을 천천히 오르는 방법을 확인할 예정임.", observation_type: ["지원 계획"], scope: "individual", sensitive: false}
        - {observation_id: "O3", child_ids: ["C02"], activity: "블록 놀이", text: "관찰: C02가 네모 블록 세 개를 쌓음.", observation_type: ["행동"], scope: "individual", sensitive: false}
    input: {record_type: "관찰일지", child_ids: ["C01", "C02"], observation_ids: ["O1", "O2", "O3"]}
    expect:
      every_individual_sentence_has_observation_ids: true
      observation_ids_must_be_from_input: true
      special_notes_empty: ["C01", "C02"]
      records:
        C01:
          missing_evidence: false
          allowed_observation_ids: ["O1", "O2"]
          content_kinds_must_equal: ["관찰", "지원 계획"]
          content_kind_required_facts:
            관찰: ["C01이 미끄럼틀 계단을 오르다 넘어졌다", "C01의 오른쪽 무릎이 살짝 까졌다", "흐르는 물로 씻고 밴드를 붙였다"]
            지원 계획: ["다음 실외 놀이 전에 C01과 미끄럼틀 계단을 천천히 오르는 방법을 확인할 예정이다"]
          forbidden_facts: ["C01이 왼쪽 무릎을 다쳤다", "C01이 병원에 갔다", "C01과 이미 안전한 계단 오르기를 연습했다"]
        C02:
          missing_evidence: false
          allowed_observation_ids: ["O3"]
          content_kinds_must_equal: ["관찰"]
          content_kind_required_facts:
            관찰: ["C02가 네모 블록 세 개를 쌓았다"]
          forbidden_facts: ["C02가 부상을 입었다", "C02의 배움이나 발달을 해석한 내용", "입력에 없는 교사의 놀이 지원이나 지원 계획"]
    note: "AC1·AC4 — 팀 설계: SPEC 5절의 관찰일지 항목 분류"
