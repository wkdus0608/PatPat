        examples:
          - {min: 5, max: 5, approximate: false}
          - {min: 10, max: 10, approximate: true}
          - {min: 20, max: 30, approximate: false}
          - {min: 80, max: 80, approximate: true}
          - {min: 90, max: 90, approximate: true}
          - {min: 120, max: 120, approximate: false}
        # 이 속성의 조사 근거
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      work_context: # 기록을 작성한 상황이나 장소
        type: list
        examples: [휴게시간, 보육 중 중간중간, 퇴근 전, 퇴근 후, 집]
        # 이 속성의 조사 근거
        evidence: [로그 1, 로그 2, 로그 3, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      writing_mode: # 기록을 작성한 방식
        type: enum
        values: [아동별 개별작성, 공통내용과 특이사항 분리, 일괄작성, 보육 중 중간중간 작성]
        # 이 속성의 조사 근거
        evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      delay_reasons: # 기록 작성이 늦어진 이유
        type: list
        examples: [보육과 아동 안전, 행사, 상담, 과다업무, 청소·단체·개인업무, 체력 이슈, 업무 우선순위]
        # 이 속성의 조사 근거
        evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    relations: # 다른 클래스와의 연결
      - performed_by: Teacher # 교사가 작성 작업을 수행한다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - covers: Child # 작성 작업이 한 명 이상의 아동을 대상으로 한다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - uses: EvidenceSource # 작성 작업에서 근거 자료를 사용한다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9]
      - produces: ChildcareRecord # 작성 작업으로 보육 기록이 만들어진다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]

  ChildcareRecord:
    description: 어린이집 교사가 확인된 관찰을 정리해 작성·검토하는 알림장 또는 관찰일지
    note: 팀의 제품 정의상 알림장은 사용하는 기관에서 매일 보호자와 일상·안부를 공유하는 기록이며, 관찰일지는 월 1~2회 이상 대상 기간의 관찰을 모아 작성한다. 안부 문구는 관찰 사실의 근거가 아니다. 조사 원문의 기관별 일지 서식을 모두 관찰일지로 해석하지 않는다.
    # 이 클래스를 만든 조사 근거, ChildcareRecord 를 왜 넣었는가
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes: # ChildcareRecord 가 가지는 특징
      record_type: # 작성한 보육 기록의 종류
        type: enum
        values: [알림장, 관찰일지]
        note: 현재 제품의 두 기록명이다. 조사 원문의 일지 표기를 제품에서 관찰일지로 통일하며 원문의 주기·서식은 그대로 보존한다.
        # 이 속성의 조사 근거
        evidence: [로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9]
      content_sections: # 기록에 포함하는 내용
        type: list
        examples: [놀이·활동, 특이사항, 전달사항, 아동 반응, 관찰, 배움 읽기, 놀이 지원, 지원 계획, 한 주 일과, 개별 특성]
        # 이 속성의 조사 근거
        evidence: [로그 1, 로그 2, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9]
      missing_sections: # 일지에서 아직 내용이 없는 항목
        description: 조사에 등장한 기관별 일지 서식에서 교사가 입력하지 않은 항목을 표시한다.
        type: list
        examples: [배움 읽기, 놀이 지원, 지원 계획]
        note: 기관별 완료 기준의 차이를 보여 주는 조사 속성이며 현재 관찰일지의 필수 API 항목이 아니다. 빈 항목을 자동 해석으로 채우거나 기관 서식 준수를 보증하지 않는다.
        # 이 속성의 조사 근거
        evidence: [로그 7, 로그 8, 관찰 1]
      individualization_mode: # 공통 내용과 아동별 내용을 쓰는 방식
        type: enum
        values: [아동별 특성 반영, 공통내용 뒤 역할·말·감상 추가, 공통내용 뒤 특이사항 추가, 동일 문장 사용, 일괄작성, 공통틀 뒤 특징적 일화 추가, 공통문장 뒤 개별 한 문장 추가, 참여도별 표현]
        # 이 속성의 조사 근거
        evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      completion_criteria: # 기록을 완료했다고 판단하는 기준
        type: list
        examples: [놀이·특이사항·전달사항 포함, 표준보육과정 반영, 문장 매끄러움, 놀이·지원내용 제시, 보호자가 하루를 상상할 수 있음, 오탈자 점검, "관찰 > 배움 읽기 > 놀이 지원 > 지원 계획 반영"]
        # 이 속성의 조사 근거
        evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      editing_tool: # 문장을 다듬거나 오탈자를 확인할 때 쓰는 도구
        type: enum
        values: [직접 문장 수정·오탈자 점검, GPT 문장 다듬기]
        # 이 속성의 조사 근거
        evidence: [로그 3, 로그 4, 로그 5, 로그 10]
      status: # 기록 작성이 현재 어디까지 되었는지
        type: enum
        values: [작성중, 검토중, 완료, 지연]
        # 이 속성의 조사 근거
        evidence: [로그 3, 로그 4, 로그 7, 로그 8, 로그 10]
      record_id: # 기록을 가리키는 식별자
        description: 교사가 검토·확정할 기록을 지정하는 식별자다.
        type: string
        key: true
        note: SPEC 5절 `record_id`. `POST /records/{record_id}/confirm`의 대상이다.
        # 이 속성의 설계 근거: 교사가 기록마다 검토를 마친 뒤 완료하는 흐름
        evidence: [로그 3, 로그 4, 로그 7, 로그 8, 로그 10]
      common_text: # 같은 활동에 참여한 아동에게 공통인 문장
        description: 여러 아동이 함께한 활동의 공통 내용을 아이별 문장과 분리해 담는다.
        type: string
        note: SPEC 5절 `common_text`. 공통 관찰만으로 아동의 개별 문장을 만들지 않는다(AC4, AC5).
        # 이 속성의 조사 근거: 공통문 재사용·일괄작성
        evidence: [로그 4, 로그 5, 로그 6, 로그 9, 관찰 3]
      individual_sentences: # 아동별 문장과 그 근거 관찰
        description: 한 아동에 관한 문장과, 문장의 사실을 뒷받침하는 관찰 ID 목록을 짝으로 담는다.
        type: list
        item_fields: [text, observation_ids]
        note: SPEC 5절 `individual_sentences`. 문장마다 `observation_ids`가 1개 이상이고 그 관찰이 문장의 사실을 뒷받침해야 한다(AC1). 다른 아동의 관찰을 넣지 않는다(AC3).
        # 이 속성의 조사 근거: 공통문 뒤 아동별 역할·말·반응 추가
        evidence: [로그 2, 로그 4, 로그 7, 로그 8, 로그 9, 로그 10, 관찰 3]
      special_notes: # 일반 문장과 분리한 특이사항
        description: 부상·다툼 같은 민감 사항을 일반 문장과 분리하고 민감 여부를 표시한다.
        type: list
        item_fields: [text, sensitive]
        note: "SPEC 5절 `special_notes`. 부상·다툼은 `sensitive: true`이며 당사자·부위·상황·정도·조치를 바꾸지 않는다(AC7)."
        # 이 속성의 조사 근거: 부상·민감 사항의 문장 검토
        evidence: [로그 1, 로그 2, 로그 3, 로그 5, 관찰 2]
      missing_evidence: # 아동의 개별 관찰이 없음
        description: 선택한 관찰 중 이 아동의 개별 관찰이 0건이면 개별 문장 없이 확인 필요로 표시한다.
        type: boolean
        note: SPEC 5절 `missing_evidence`(AC4). 관찰의 주체가 불명확함을 뜻하는 Observation.needs_confirmation과 다른 개념이다.
        # 이 속성의 조사 근거: 확인할 근거가 없으면 아동별 사실을 빼는 우회로
        evidence: [로그 9, 관찰 3]
    relations: # 다른 클래스와의 연결
      - authored_by: Teacher # 교사가 보육 기록을 작성한다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - about: Child # 보육 기록이 특정 아동에 관한 것이다 라는 의미임. SPEC 5절에서는 `child_id`
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - summarizes: Activity # 보육 기록이 활동 내용을 정리한다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9]
      - includes: Observation # 보육 기록에 관찰 내용이 포함된다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 3, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - shared_with: Guardian # 보육 기록을 보호자에게 전달한다 라는 의미임
        evidence: [로그 3, 로그 5, 로그 6, 로그 9]
      - created_in: WritingSession # 보육 기록이 작성 작업 중에 만들어진다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - draws_on: EvidenceSource # 보육 기록 작성에 근거 자료를 참고한다 라는 의미임
        evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9]

# 범위 밖(명시): 교사의 관찰·판단 대체 / 교사 검토 없는 자동 전송 / 아동 발달 진단 / 외부 어린이집 플랫폼 연동 / 알림장·관찰일지 외 추가 문서 유형
# 핵심 흐름: Teacher --(performs)--> WritingSession --(uses)--> EvidenceSource --(supports)--> Observation --(documented_in)--> ChildcareRecord --(shared_with)--> Guardian
# 관찰 흐름: Child --(participates_in)--> Activity --(is_context_of)--> Observation --(about)--> Child
