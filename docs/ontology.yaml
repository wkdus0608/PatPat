# 핵심 흐름: Teacher가 Child·Activity에 연결된 Observation을 기록하고,
# DailyNote·Journal이 공통 활동과 아이별 사실을 구분해 담으며 Teacher가 확정한다.
# Guardian·WritingSession의 업무 배경은 조사 문서에서 설명한다.
# 근거의 종류는 별도 EvidenceSource 클래스 대신 Observation.source_type으로 설명한다.
# source_type·대상일·기간은 도메인 설명이며, 현재 API에 임의로 추가하는 필드가 아니다.
version: 4
classes:
  Teacher:
    description: 관찰을 입력하고 기록 초안을 검토·확정하는 어린이집 담임 교사
    evidence: [로그 4, 로그 6, 로그 7, 로그 9]
    attributes:
      id: {type: string, key: true, note: 팀의 교사 식별 설계}
    relations:
      - records: Observation
        evidence: [로그 7, 관찰 2]
      - reviews: DailyNote
        evidence: [로그 3, 로그 9, 관찰 1]
      - reviews: Journal
        evidence: [로그 4, 로그 7, 관찰 2]

  Child:
    description: 확인된 관찰과 기록의 대상 아동
    evidence: [로그 4, 로그 6, 로그 9]
    attributes:
      child_id: {type: string, key: true, note: 가명 코드이며 실명 매핑은 로컬에만 보관하는 팀 설계}
    relations:
      - participates_in: Activity
        evidence: [로그 4, 로그 7, 로그 9]

  Activity:
    description: 여러 아동이 함께 참여하거나 개별 관찰이 발생한 놀이·일과 맥락
    evidence: [로그 4, 로그 6, 로그 9]
    attributes:
      name: {type: string, evidence: [로그 4, 로그 6]}
    relations:
      - context_of: Observation
        evidence: [로그 4, 로그 9]

  Observation:
    description: 아동에 대해 교사가 확인한 사실과 명시해 입력한 지원 내용
    evidence: [로그 4, 로그 6, 로그 7, 로그 9]
    attributes:
      observation_id: {type: string, key: true, note: 문장의 근거를 연결하기 위한 팀 설계}
      text: {type: string, evidence: [로그 7, 관찰 2]}
      observation_type: {type: list, examples: [행동, 발화, 반응, 부상, 다툼, 교사 지원, 지원 계획], note: 내용의 종류이며 고정 열거 목록이 아님}
      scope: {type: enum, values: [common, individual, joint, unresolved], note: 아동 연결과 초안 위치를 결정하는 SPEC의 설계 분류}
      sensitive: {type: boolean, note: 부상·다툼을 구분하는 설계 속성, evidence: [로그 2, 로그 3, 관찰 1]}
      source_type: {type: list, examples: [교사의 기억, 메모, 사진 재확인, 동료 교사 확인, 아동에게 확인], note: 기존 업무의 근거 종류이며 제품의 사진 입력·분석 기능이나 API 필드가 아님, evidence: [로그 2, 로그 7, 로그 8, 로그 9]}
    relations:
      - about: Child
        note: common은 확인된 참여 아동, individual은 1명, joint는 공동 사건 참여 아동들, unresolved는 아동 연결 없음
        evidence: [로그 4, 로그 9, 관찰 3]
      - occurs_during: Activity
        evidence: [로그 4, 로그 9]

  DailyNote:
    description: 대상일의 일상과 특이사항을 보호자와 공유하기 위해 교사가 작성하는 알림장
    evidence: [로그 3, 로그 7, 로그 9]
    attributes:
      record_id: {type: string, key: true, note: 기록 식별 설계}
      target_date: {type: string, note: 교사의 관찰 선택 기준이며 현재 API 필드가 아님}
      common_text: {type: string, evidence: [로그 9, 관찰 3]}
      individual_sentences: {type: list, note: 선택한 근거 관찰 ID를 문장별로 연결, evidence: [로그 4, 로그 9]}
      special_notes: {type: list, note: 부상·다툼을 분리하되 사실을 보존, evidence: [로그 2, 로그 3, 관찰 1]}
      missing_evidence: {type: boolean, note: 개별·공동 관찰이 없으면 확인 필요로 표시하는 설계, evidence: [로그 9, 관찰 3]}
      status: {type: enum, values: [작성중, 검토중, 완료], note: 교사 확정으로만 완료가 되는 설계, evidence: [로그 3, 관찰 1]}
    relations:
      - about: Child
        evidence: [로그 3, 로그 9]
      - includes: Observation
        evidence: [로그 4, 로그 9]
      - summarizes: Activity
        evidence: [로그 9, 관찰 3]
      - reviewed_by: Teacher
        evidence: [로그 3, 관찰 1]

  Journal:
    description: 교사가 대상 기간의 확인된 관찰을 모아 작성하는 관찰일지
    evidence: [로그 4, 로그 7, 로그 8]
    attributes:
      record_id: {type: string, key: true, note: 기록 식별 설계}
      target_period: {type: string, note: 교사의 관찰 선택 기준이며 현재 API 필드가 아님}
      common_text: {type: string, note: 공통 활동을 개별 관찰과 구분하는 팀 설계}
      individual_sentences: {type: list, note: 선택한 근거 관찰 ID를 문장별로 연결하는 팀 설계}
      content_kind: {type: enum, values: [관찰, 배움 읽기, 놀이 지원, 지원 계획], note: 교사가 입력한 항목만 분류하며 없는 단계의 내용은 생성하지 않음, evidence: [관찰 2]}
      missing_evidence: {type: boolean, note: 개별·공동 관찰이 없으면 확인 필요로 표시하는 팀 설계}
      status: {type: enum, values: [작성중, 검토중, 완료], note: 교사 확정으로만 완료가 되는 팀 설계}
    relations:
      - about: Child
        evidence: [로그 4, 로그 8]
      - includes: Observation
        evidence: [로그 4, 로그 7, 관찰 2]
      - reviewed_by: Teacher
        evidence: [로그 4, 관찰 2]

rules:
  - common은 공통 문장에 사용하며 개별 근거로 대신하지 않는다.
  - individual·joint는 해당 아동이 관여한 사실에만 사용한다.
  - unresolved는 아동을 추측해 연결하지 않고 초안에서 제외한다.
  - 입력에 없는 행동·감정·발화·원인·조치를 생성하지 않는다.
  - 알림장의 부상·다툼은 특이사항으로 분리하며 관찰일지는 관찰 문장으로 보존한다.
  - 교사 검토·확정 전에는 기록을 완료하지 않는다. 제품은 보호자 발송을 수행하지 않는다.
