# 미니 온톨로지: 제품(SPEC)에 쓰이는 개념만 남긴다. 모든 클래스·속성·관계에는 조사 근거 또는 설계 이유를 단다.
# 관계는 한 방향으로만 적고, 대상은 이 파일의 6개 클래스 중 하나다.
# 아동 식별자는 가명 코드(C01 등)다. 실명↔가명 매핑과 처리 계층(로컬/외부 AI)은 클래스가 아니며 SPEC 4절·AC10을 따른다.
version: 3
classes:
  Teacher:
    description: 아동을 관찰해 입력하고, 기록 초안을 검토·확정하는 어린이집 담임 교사
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    relations:
      - records: Observation # 교사가 관찰을 입력한다
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - confirms: ChildcareRecord # 교사가 초안을 검토·확정한다 (AC8)
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]

  Child:
    description: 관찰과 기록의 대상 아동. child_id는 가명 코드다.
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    relations:
      - participates_in: Activity # 아동이 활동에 참여한다
        evidence: [로그 2, 로그 5, 로그 7, 로그 9, 로그 10]

  Guardian:
    description: 교사가 확정한 기록을 기존 수단으로 전달받는 보호자. 제품 사용자가 아니며 발송 기능은 없다.
    evidence: [로그 2, 로그 3, 로그 5, 로그 6, 로그 8, 로그 9]
    relations:
      - guardian_of: Child
        evidence: [로그 2, 로그 3, 로그 5, 로그 6, 로그 9]

  Activity:
    description: 관찰이 일어난 놀이·일과·행사 맥락. 공통 활동 문장(common_text)의 재료다.
    evidence: [로그 1, 로그 2, 로그 3, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]

  Observation:
    description: 교사가 확인해 입력한 아동의 행동·발화·반응·특이사항
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      source: # 관찰이 입력된 형식
        type: enum
        values: [음성, 텍스트]
        note: 설계 속성(팀 결정, SPEC 3절). 기존 업무에서 교사가 회상에 쓰던 사진·동료·교구는 PROBLEM 3절의 증거이며 제품 입력이 아니다.
        evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 7, 로그 8, 로그 9]
      scope: # 공통 활동인지 아동별 사실인지
        type: enum
        values: [common, individual, joint, unresolved]
        note: 설계 분류(AC3·AC5). 공통 활동, 한 아동의 사실, 여러 아동의 공동 사건, 주체 미확정을 구분한다.
        evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 7, 로그 9]
      sensitive: # 부상·다툼 여부
        type: boolean
        note: true이면 기록의 special_notes로 분리한다(AC7).
        evidence: [로그 2, 로그 3, 로그 5]
    relations:
      - about: Child # 관찰은 한 명 이상의 아동에 관한 것이다
        evidence: [로그 2, 로그 3, 로그 6, 로그 7, 로그 9, 로그 10]
      - occurs_during: Activity
        evidence: [로그 2, 로그 3, 로그 6, 로그 7, 로그 9, 로그 10]

  ChildcareRecord:
    description: 선택한 관찰로 만든 알림장 또는 관찰일지. 교사가 확정해야 완료된다.
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      record_type:
        type: enum
        values: [알림장, 관찰일지]
        note: 알림장은 당일, 관찰일지는 대상 기간의 관찰로 쓴다(팀의 제품 정의).
        evidence: [로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9]
      status:
        type: enum
        values: [작성중, 검토중, 완료, 지연]
        evidence: [로그 3, 로그 4, 로그 7, 로그 8, 로그 10]
    relations:
      - about: Child
        evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
      - based_on: Observation # 아이별 문장은 근거 관찰에 연결된다 (AC1)
        evidence: [로그 1, 로그 2, 로그 3, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]

# 핵심 흐름: Teacher --records--> Observation --about--> Child
#            ChildcareRecord --based_on--> Observation, Teacher --confirms--> ChildcareRecord
